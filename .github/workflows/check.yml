name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck
        run: |
          command -v shellcheck >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          }

      - name: Run the gate
        run: ./check.sh
