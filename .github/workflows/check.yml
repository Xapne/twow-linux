name: check

on:
  push:
  pull_request:
  # The fixes in patches/ are carried against branches that move on their own,
  # so upstream is asked about them on a schedule rather than only when
  # somebody pushes here.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so the gate means the same thing here and on a contributor's
      # machine. The runner's own shellcheck trails several releases, and the
      # two disagree about which findings to report.
      - name: Install shellcheck
        run: pipx install shellcheck-py==0.11.0.1

      - name: Run the gate
        run: ./check.sh

  patches:
    # Clones the cores, so it stays off the push path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask upstream whether the carried fixes still apply
        run: ./check.sh --patches

  publish:
    # The image compose.yaml pulls, built from the release itself, so a pull
    # hands out the same kit as the tag. A kit older than the core it clones
    # misses migrations the core expects.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/xapne/twow-linux:latest
            ghcr.io/xapne/twow-linux:${{ github.ref_name }}
