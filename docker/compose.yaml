# Put TurtleWoW_1.18.zip and data.zip beside this file, then: docker compose up
name: twow

services:
  twow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: twow-linux:latest
    container_name: twow
    # The seed runs a Windows x86-64 binary under wine, so the image is amd64
    # even on an arm64 host, where Docker Desktop translates it.
    platform: linux/amd64
    # The world console reads from the terminal, and reaching it with
    # 'docker attach' needs both of these.
    stdin_open: true
    tty: true
    # No init here: the image already enters through tini, and asking for both
    # leaves tini as a child of Docker's own, which it warns about.
    restart: unless-stopped
    # The host's loopback is where "only this machine" lives in a container.
    # Both of these come from .env, which is where LAN play is turned on.
    ports:
      - "${TWOW_PUBLISH_ON:-127.0.0.1}:3724:3724"   # realmd, the login
      - "${TWOW_PUBLISH_ON:-127.0.0.1}:8091:8091"   # mangosd, the world
    environment:
      # The address clients are told to connect to. A container cannot learn
      # the host's, so it is given one here or keeps 127.0.0.1.
      TWOW_REALM_ADDRESS: "${TWOW_REALM_ADDRESS:-}"
    volumes:
      # Everything a conversion makes: the build, the map data, the database
      # and the characters in it.
      - twow-data:/twow
      # Brought by whoever runs this, and only ever read.
      - ./TurtleWoW_1.18.zip:/twow/TurtleWoW_1.18.zip:ro
      - ./data.zip:/twow/data.zip:ro
    # The compile takes about a gigabyte per parallel job and the kit reads
    # these limits itself, sizing the job count to whatever is granted here.
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  twow-data:
